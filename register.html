<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <style>
        .small{
            height: 650px;
            width: 350px;
            background-color: #F4F1E8;
            text-align: center; 
            border-radius: 10px;
            border: 2px dashed green;
            color: #263126;
        }

        .img{
            margin-top: 25px;
            border-radius: 30px;
            height: 80px;
        }

        input{
            padding: 10px;
            background-color: #DCE9D8;
            color: #263126;
            border-radius: 10px;
            border: none;
            width: 200px;
        }

        input::placeholder{
            color: #687568;
        }

        .btn{
            border-radius: 20px;
            background-color: darkgreen;
            color: white;
            padding: 10px;
            border: none;
            width: 200px;
            font-size: 20px;
        }

        .btn:hover{
            background-color: green;
        }
    </style>

    <div class="small">
        <img src="./images/green.png" alt="img" class="img">
        <br>
        <span style="font-size: 40px; font-weight: bold; color: darkgreen;">Register</span>
        <br>
        <span style="font-size: 30px; font-style: italic; color: darkolivegreen;">As Staff</span>
        <br><br>
        <input type="text" placeholder="Name">
        <br><br>
        <input type="text" placeholder="Phone">
        <br><br>
        <input type="text" placeholder="Email">
        <br><br>
        <input type="text" placeholder="Gender">
        <br><br>
        <input type="password" placeholder="Password">
        <br><br>
        <input type="text" placeholder="Confirm Password">
        <br><br><br>
        <button class="btn">Register</button>
        <br><br>
        <footer>Already Have an Account?<span style="color: #356B35; padding-left: 50px;"><u><i>Login</i></u></span></footer>
    </div>
</body>
</html>
