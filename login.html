<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <style>
        .small{
            height: 520px;
            width: 350px;
            background-color: #F4F1E8;
            text-align: center; 
            border-radius: 10px;
            border: 2px dashed green;
            color: #263126;
        }

        .img{
            margin-top: 30px;
            border-radius: 30px;
        }

        input{
            padding: 10px;
            background-color: #DCE9D8;
            color: #263126;
            border-radius: 10px;
            border: none;
            width: 200px;
        }

        input::placeholder{
            color: #687568;
        }

        .btn{
            border-radius: 20px;
            background-color: darkgreen;
            color: white;
            padding: 10px;
            border: none;
            width: 200px;
            font-size: 20px;
        }

        .btn:hover{
            background-color: green;
        }
    </style>

    <div class="small">
        <img src="./images/green.png" alt="img" class="img">
        <br>
        <span style="font-size: 40px; font-weight: bold; color: darkgreen;">Login</span>
        <br>
        <span style="font-size: 30px; font-style: italic; color: darkolivegreen;">As Staff</span>
        <br><br>
        <input type="text" placeholder="📧Email">
        <br><br>
        <input type="password" placeholder="🔒Password">
        <br>
        <p style="font-style: italic; color: #356B35; padding-left: 100px;"><u>Forgot Password</u></p>
        <button class="btn">Login</button>
        <br><br>
        <footer>New Here?<span style="color: #356B35; padding-left: 100px;"><u><i>Register</i></u></span></footer>
    </div>
</body>
</html>
